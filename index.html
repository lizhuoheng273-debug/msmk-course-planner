<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="guF3plQdpyIYLG9OobXpPf">
<title>MSc Marketing 排课系统 · 按周视图</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#2b2f36; --sub:#6b7280;
    --line:#e3e7ee; --core:#1f6fb8; --elec:#6d5bd0; --cap:#0f8a6a;
    --core-bg:#e8f1fb; --elec-bg:#efeafd; --cap-bg:#e2f5ee;
    --warn:#c0392b; --shadow:0 1px 3px rgba(20,30,50,.08),0 4px 16px rgba(20,30,50,.06);
    --intern:#3b8a3b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
         border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:650}
  .counts{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;box-shadow:var(--shadow)}
  .chip b{font-size:14px}
  .chip.core b{color:var(--core)} .chip.elec b{color:var(--elec)} .chip.cap b{color:var(--cap)}
  .chip.warn{border-color:#f3c0b8;background:#fdecea;color:var(--warn)}
  main{display:flex;gap:16px;padding:16px 20px;align-items:flex-start;max-width:1500px;margin:0 auto}
  .courses{width:430px;flex:0 0 430px;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
  .calendar{flex:1;min-width:0}
  .grp{margin-bottom:14px;scroll-margin-top:8px}
  .grp h3{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:600;letter-spacing:.3px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;box-shadow:var(--shadow)}
  .card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .code{font-weight:700;font-size:13.5px}
  .badge{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .b-core{background:var(--core-bg);color:var(--core)}
  .b-elec{background:var(--elec-bg);color:var(--elec)}
  .b-cap{background:var(--cap-bg);color:var(--cap)}
  .b-cross{background:#fff4d6;color:#9a6b00}
  .title{font-size:12.5px;color:var(--sub);flex:1;min-width:120px}
  .opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .opt{position:relative;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;
       font-size:12px;transition:.12s;min-width:150px;flex:1}
  .opt:hover{border-color:#b9c4d4}
  .opt .lab{font-weight:700;margin-right:5px}
  .opt .when{color:var(--sub);font-size:10.5px;display:block;margin-top:2px;line-height:1.35}
  .opt .ven{color:#8a6d3b;font-size:10.5px;display:block;margin-top:1px}
  .opt.sel{background:var(--core-bg);border-color:var(--core);color:var(--core)}
  .opt.sel.elec{background:var(--elec-bg);border-color:var(--elec);color:var(--elec)}
  .opt.sel.cap{background:var(--cap-bg);border-color:var(--cap);color:var(--cap)}
  .opt.sel .ven{color:#9a6b00}
  .opt.dim{opacity:.42;cursor:not-allowed;background:#f1f3f6}
  .opt .reason{display:block;margin-top:3px;font-size:10.5px;color:var(--warn);font-weight:600}
  .cal-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:12.5px;color:var(--sub)}
  .tab.active{background:var(--core);border-color:var(--core);color:#fff;font-weight:600}
  .cal-btns{display:flex;gap:8px;margin-left:auto}
  .cal-btns button{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--ink)}
  .cal-btns button.primary{background:var(--core);color:#fff;border-color:var(--core)}
  .cal-btns button:hover{filter:brightness(.97)}
  .cal-range{font-size:12.5px;color:var(--sub);margin:2px 2px 10px;padding:8px 12px;background:#eef4fb;border:1px solid #d6e6f7;border-radius:9px}
  .cal-range b{color:var(--core)}
  .weeknav{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .weeknav button{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--ink)}
  .weeknav button:hover{background:#eef2f7}
  .wklabel{font-size:13.5px;font-weight:600}
  .wklabel .sub{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
  .weekstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scroll-behavior:smooth;cursor:grab}
  .weekstrip.drag{cursor:grabbing;scroll-behavior:auto}
  .weekstrip::-webkit-scrollbar{height:7px}
  .weekstrip::-webkit-scrollbar-thumb{background:#cbd3df;border-radius:4px}
  .wkchip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;
         font-size:11.5px;color:var(--sub);white-space:nowrap;cursor:pointer;user-select:none}
  .wkchip.active{background:var(--core);border-color:var(--core);color:#fff;font-weight:600}
  .wkchip .cls{display:block;font-size:10px;color:#9aa3b0;margin-top:1px}
  .wkchip.active .cls{color:#dce8f6}
  .cal-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px 12px;box-shadow:var(--shadow);overflow:auto}
  .grid{display:flex;min-width:680px}
  .axis{width:42px;flex:0 0 42px;position:relative}
  .axis .hl{position:absolute;right:6px;font-size:10px;color:var(--sub);transform:translateY(-50%)}
  .days{flex:1;display:flex}
  .day{flex:1;position:relative;border-left:1px solid var(--line);min-width:0}
  .day:first-child{border-left:none}
  .day .dh{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:var(--sub);z-index:3}
  .day .dd{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:11px;color:var(--sub);z-index:3}
  .day.wknd .dh,.day.wknd .dd{color:#b06a2e}
  .day.today .dh::after{content:"●";color:var(--core);font-size:8px;margin-left:3px}
  .intern{position:absolute;left:0;right:0;background:rgba(59,138,59,.07);border-top:1px dashed rgba(59,138,59,.3);border-bottom:1px dashed rgba(59,138,59,.3);z-index:0}
  .hr{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:0;z-index:1}
  .hr.solid{border-top:1px solid #eef1f6}
  .blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:3px 5px;color:#fff;font-size:10.5px;line-height:1.25;overflow:hidden;
       overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18);cursor:pointer;z-index:2}
  .blk.core{background:var(--core)} .blk.elec{background:var(--elec)} .blk.cap{background:var(--cap)}
  .blk.cf{outline:2px solid var(--warn);outline-offset:-2px}
  .blk .bcode{font-weight:700;font-size:11px}
  .blk .bven{opacity:.92;font-size:9.5px}
  .blk .btime{opacity:.95;font-size:9.5px}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:40px 10px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px;align-items:center;flex-wrap:wrap}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2f36;color:#fff;
        padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:80vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{color:var(--sub);font-size:11.5px;margin:6px 2px 0;line-height:1.6}
  .foot b{color:var(--ink)}
  /* 方案保存 / 导入 */
  .plans{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 2px}
  .plans .phint{color:var(--sub);font-size:12.5px}
  .plan-item{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:9px;
             padding:5px 6px 5px 12px;font-size:13px;cursor:pointer;max-width:260px;transition:.15s}
  .plan-item:hover{border-color:#185FA5;box-shadow:0 1px 7px rgba(24,95,165,.14)}
  .plan-item .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plan-item .pc{color:var(--sub);font-size:11px;flex:none}
  .plan-item .pdel{margin-left:2px;border:none;background:#f1f0ec;color:#b23;border-radius:6px;width:20px;height:20px;
                   cursor:pointer;font-size:14px;line-height:1;flex:none}
  .plan-item .pdel:hover{background:#fdecea}
  /* ===== 手机端自适应（<820px） ===== */
  .btn-courses{display:none}
  @media (max-width:820px){
    body{overflow-x:hidden}
    header{padding:10px 14px;gap:10px}
    header h1{font-size:15px}
    .counts{gap:6px;margin-left:0}
    .chip{padding:3px 9px;font-size:11.5px}
    main{flex-direction:column;padding:10px 12px;gap:10px}
    .courses{width:100%;flex:none;max-height:0;overflow:hidden;transition:max-height .25s ease}
    .courses.open{max-height:52vh;overflow:auto;padding-bottom:6px}
    .btn-courses{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:9px;
                 padding:7px 14px;cursor:pointer;font-size:13px;color:var(--ink);margin-bottom:8px}
    .btn-courses b{color:var(--core)}
    .cal-btns{margin-left:0;flex-wrap:wrap}
    .cal-toolbar{flex-direction:column;align-items:stretch}
    .tabs{order:1}
    .cal-btns{order:2;justify-content:space-between}
    .cal-range{font-size:12px}
    .weeknav{flex-wrap:wrap}
    .cal-wrap{padding:6px 8px 10px;overflow:auto;-webkit-overflow-scrolling:touch}
    .grid{min-width:600px}
    .blk{font-size:10px;padding:2px 4px}
    .blk .bcode{font-size:10px}
    .legend{gap:10px;font-size:11px}
    .foot{font-size:11px}
  }
</style>

/* ---------- 日期工具 ---------- */
function parseD(s){const p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function fmtD(dt){const y=dt.getUTCFullYear(),m=String(dt.getUTCMonth()+1).padStart(2,'0'),d=String(dt.getUTCDate()).padStart(2,'0');return y+'-'+m+'-'+d;}
function addDays(s,n){const dt=parseD(s);dt.setUTCDate(dt.getUTCDate()+n);return fmtD(dt);}
function mondayOf(s){const dt=parseD(s);const wd=dt.getUTCDay();const diff=(wd===0?-6:1-wd);return addDays(s,diff);}
function weekdayOf(s){const w=parseD(s).getUTCDay();return w===0?7:w;}
function md(s){const dt=parseD(s);return (dt.getUTCMonth()+1)+'/'+dt.getUTCDate();}
function fmt(min){const h=Math.floor(min/60),m=min%60;return h+':'+(m<10?'0'+m:m);}

/* ---------- 冲突判断（基于真实 session） ---------- */
function overlap(a,b){return a[0]<b[1] && b[0]<a[1];}
function periodsOverlap(m1,m2){return m1.some(x=>m2.includes(x));}
function sessionsOverlap(a,b){
  for(const sa of a.sessions)for(const sb of b.sessions){
    if(sa.d!==sb.d)continue;
    for(const x of sa.s)for(const y of sb.s)if(overlap(x,y))return true;
  }
  return false;
}
function conflictWith(s){
  for(const id of sel){
    const t=SECTIONS.find(x=>idOf(x)===id);
    if(!t)continue;
    if(t.code===s.code) return {reason:'course',with:t};
    if(periodsOverlap(s.mods,t.mods) && sessionsOverlap(s,t)) return {reason:'time',with:t};
  }
  return null;
}
function statusOf(s){
  if(s.cancelled) return 'cancelled';
  if(sel.has(idOf(s))) return 'sel';
  const c=conflictWith(s);
  if(c) return c.reason==='course'?'owned':'conflict';
  return 'avail';
}
function typeClass(t){return t==='Core'?'core':t==='Elective'?'elec':'cap';}

/* ---------- 左侧“上课时间”摘要（从真实日期推导） ---------- */
function whenSummary(s){
  const byDay={};
  s.sessions.forEach(se=>{
    const wd=weekdayOf(se.d);
    (byDay[wd]=byDay[wd]||new Set());
    se.s.forEach(sl=>byDay[wd].add(fmt(sl[0])+'-'+fmt(sl[1])));
  });
  return [1,2,3,4,5,6,7].filter(d=>byDay[d])
    .map(d=>DAYS[d]+' '+[...byDay[d]].join('/')).join(' · ');
}

function renderCourses(){
  const wrap=document.getElementById('courseList');
  wrap.innerHTML='';
  const codeGroups={};
  SECTIONS.forEach(s=>{(codeGroups[s.code]=codeGroups[s.code]||[]).push(s.g);});
  GROUPS.forEach(g=>{
    const items=SECTIONS.filter(s=>s.g===g.key);
    if(!items.length)return;
    const grp=document.createElement('div');grp.className='grp';grp.id='grp-'+g.key;
    grp.innerHTML='<h3>'+g.name+'</h3>';
    const byCode={};
    items.forEach(s=>{(byCode[s.code]=byCode[s.code]||[]).push(s);});
    Object.keys(byCode).forEach(code=>{
      const secs=byCode[code];
      const first=secs[0];
      const cross=codeGroups[code].length>1;
      const card=document.createElement('div');card.className='card';
      let opts='';
      secs.forEach(s=>{
        const st=statusOf(s);
        const cls=['opt'];
        if(st==='sel')cls.push('sel',typeClass(s.type));
        if(st==='owned'||st==='conflict')cls.push('dim');
        let reason='';
        if(st==='cancelled'){cls.push('dim');reason='<span class="reason">该班已取消（v3）</span>';}
        else if(st==='owned')reason='<span class="reason">已选该课其他班</span>';
        else if(st==='conflict'){const c=conflictWith(s);reason='<span class="reason">时间冲突：'+c.with.code+'</span>';}
        opts+='<div class="'+cls.join(' ')+'" data-id="'+idOf(s)+'">'+
              '<span class="lab">'+s.label+'班</span>'+
              '<span class="when">'+whenSummary(s)+'</span>'+
              '<span class="ven">'+s.venue+'</span>'+reason+'</div>';
      });
      card.innerHTML='<div class="top">'+
        '<span class="code">'+code+'</span>'+
        '<span class="badge b-'+typeClass(first.type)+'">'+(first.type==='Core'?'核心':first.type==='Elective'?'选修':'Capstone')+'</span>'+
        (cross?'<span class="badge b-cross">跨学期</span>':'')+
        '<span class="title">'+first.title+'</span></div>'+
        '<div class="opts">'+opts+'</div>';
      grp.appendChild(card);
    });
    wrap.appendChild(grp);
  });
}

/* ---------- 事件委托（保险） ---------- */
document.getElementById('courseList').addEventListener('click',e=>{

  if(!el || el.classList.contains('dim'))return;
  onPick(el.dataset.id);
});

/* ---------- 选择 / 取消 ---------- */
function onPick(id){
  const s=SECTIONS.find(x=>idOf(x)===id);
  if(sel.has(id)){sel.delete(id);renderCourses();renderGrid();updateCounts();return;}
  const st=statusOf(s);
  if(st==='cancelled'){toast('该班次已取消（v3 版）');return;}
  if(st==='owned'){toast('该课已选其他班（'+s.code+'）');return;}
  if(st==='conflict'){const c=conflictWith(s);toast('时间冲突：与 '+c.with.code+' 时间重叠');return;}
  sel.add(id);
  // 若当前学期视图不含该课，自动切到对应学期，保证点了一定能看到
  const sk=scopeOfCourse(s);
  if(sk && currentScope!==sk){currentScope=sk;buildWeeks();renderTabs();renderStrip();}
  renderCourses();renderGrid();updateCounts();
  jumpToCourseWeek(s);
}

/* ---------- 周列表构建 ---------- */
function buildWeeks(){
  const sc=SCOPES.find(x=>x.key===currentScope);
  const mods=sc.mods;
  const dates=[];
  SECTIONS.forEach(s=>{
    if(mods && !mods.some(m=>s.mods.includes(m)))return;
    s.sessions.forEach(se=>dates.push(se.d));
  });
  if(!dates.length){WEEKS=[];return;}
  dates.sort();
  let start=mondayOf(dates[0]);
  const endM=mondayOf(dates[dates.length-1]);
  const weeks=[];let idx=0;let cur=start;
  while(cur<=endM){weeks.push({idx:idx,start:cur,end:addDays(cur,6)});cur=addDays(cur,7);idx++;}
  WEEKS=weeks;
  if(currentWeek>=weeks.length)currentWeek=weeks.length-1;
  if(currentWeek<0)currentWeek=0;
}
function jumpToCourseWeek(s){
  if(!s.sessions.length)return;
  const sd=s.sessions.map(x=>x.d).sort()[0];
  const m=mondayOf(sd);
  const i=WEEKS.findIndex(w=>w.start<=m && m<=w.end);
  if(i>=0){currentWeek=i;renderGrid();renderStrip();}
}

/* 跳到第一门已选课的第一周（一键载入后避免停在空周） */
function jumpToFirstSelectedWeek(){
  if(!WEEKS.length)return;
  let earliest=null;
  sel.forEach(id=>{const s=SECTIONS.find(x=>idOf(x)===id);if(s)s.sessions.forEach(se=>{if(!earliest||se.d<earliest)earliest=se.d;});});
  if(!earliest)return;
  const m=mondayOf(earliest);
  const i=WEEKS.findIndex(w=>w.start<=m && m<=w.end);
  if(i>=0){currentWeek=i;renderGrid();renderStrip();}
}
function scopeOfCourse(s){
  for(const sc of SCOPES){
    if(sc.mods===null)continue;
    if(s.mods.some(m=>sc.mods.includes(m)))return sc.key;
  }
  return 'all';
}

/* ---------- 周条 ---------- */
let stripDrag=false,stripStartX=0,stripStartScroll=0;
function renderStrip(){
  const wrap=document.getElementById('weekStrip');
  if(!WEEKS.length){wrap.innerHTML='';return;}
  let html='';
  // 统计每周已选课程数
  const cnt={};
  SECTIONS.filter(s=>sel.has(idOf(s))).forEach(s=>{
    s.sessions.forEach(se=>{const m=mondayOf(se.d);if(cnt[m])cnt[m]++;else cnt[m]=1;});
  });
  WEEKS.forEach(w=>{
    const cls=w.idx===currentWeek?'wkchip active':'wkchip';
    const c=cnt[w.start]||0;
    html+='<div class="'+cls+'" data-i="'+w.idx+'">'+md(w.start)+'–'+md(w.end)+
          (c?'<span class="cls">'+c+' 门课</span>':'<span class="cls">—</span>')+'</div>';
  });
  wrap.innerHTML=html;
  wrap.querySelectorAll('.wkchip').forEach(el=>el.addEventListener('click',()=>{
    currentWeek=+el.dataset.i;renderGrid();renderStrip();scrollStripToActive();
  }));
  scrollStripToActive();
}

  const wrap=document.getElementById('weekStrip');

    days.push({wd:d,date:dateStr,blocks});

  // 同天时间重叠 → 冲突标记

  let html='<div class="axis">';

    // 小时线
    for(let h=9;h<=22;h++){const y=(h*60-TOP)*PX+HDR;html+='<div class="hr'+(h%2?' solid':'')+'" style="top:'+y+'px"></div>';}
    // 课程块（按开始时间排序 + 分簇列布局：重叠卡片并排分栏，不叠压）
    const sorted=day.blocks.slice().sort((a,b)=>a.start-b.start);
    const clusters=[];let cur=null;
    sorted.forEach(bk=>{
      if(cur && bk.start<cur.end){cur.end=Math.max(cur.end,bk.end);cur.items.push(bk);}
      else{cur={end:bk.end,items:[bk]};clusters.push(cur);}
    });
    clusters.forEach(cl=>{
      const colEnds=[];
      cl.items.forEach(bk=>{
        let ci=colEnds.findIndex(e=>e<=bk.start);
        if(ci<0){ci=colEnds.length;colEnds.push(0);}
        colEnds[ci]=bk.end;bk.col=ci;
      });
      cl.items.forEach(bk=>bk.nCols=colEnds.length);
    });
    sorted.forEach(bk=>{
      const top=(bk.start-TOP)*PX+HDR, h=(bk.end-bk.start)*PX;
      const leftPct=bk.col/bk.nCols*100, wPct=1/bk.nCols*100;
      const tc=typeClass(bk.s.type);
      const cf=cfSet.has(bk)?' cf':'';
      const dt=parseD(bk.date);
      const dtxt=(dt.getUTCMonth()+1)+'月'+dt.getUTCDate()+'日';
      html+='<div class="blk '+tc+cf+'" style="top:'+top+'px;height:'+Math.max(h-2,15)+'px;left:calc('+leftPct+'% + 3px);width:calc('+wPct+'% - 6px)" '+
            'title="'+bk.s.code+' '+bk.s.label+'班 · '+DAYS[day.wd]+dtxt+' '+fmt(bk.start)+'-'+fmt(bk.end)+' · '+bk.s.venue+'" data-id="'+idOf(bk.s)+'">'+
            '<div class="bcode">'+bk.s.code+'</div><span class="btime">'+fmt(bk.start)+'-'+fmt(bk.end)+'</span> · '+bk.s.label+'班<div class="bven">'+bk.s.venue+'</div></div>';
    });
    html+='</div>';
  });
  html+='</div>';
  grid.innerHTML=html;
  grid.querySelectorAll('.blk').forEach(el=>el.addEventListener('click',()=>{sel.delete(el.dataset.id);renderCourses();renderGrid();updateCounts();}));
}

/* ---------- 计数器 ---------- */
function updateCounts(){
  let core=0,cap=0,elec=0;
  sel.forEach(id=>{const s=SECTIONS.find(x=>idOf(x)===id);if(s.type==='Core')core++;else if(s.type==='Capstone')cap++;else elec++;});
  document.getElementById('cCore').textContent=core;
  document.getElementById('cCap').textContent=cap;
  document.getElementById('cElec').textContent=elec;
  const t=document.getElementById('cTotal');
  if(t)t.textContent=sel.size;
  const chip=document.getElementById('cTotalChip');
  if(elec>5){chip.className='chip warn';chip.innerHTML='选修超过 5 门！<b id="cTotal">'+elec+'</b>/5';}
  else{chip.className='chip';chip.innerHTML='已选 <b id="cTotal">'+sel.size+'</b>';}
}

/* ---------- 学期分步标签 ---------- */
function renderTabs(){
  const wrap=document.getElementById('tabs');wrap.innerHTML='';
  SCOPES.forEach(sc=>{
    const b=document.createElement('div');
    b.className='tab'+(sc.key===currentScope?' active':'');
    b.textContent=sc.name;
    b.addEventListener('click',()=>{
      currentScope=sc.key;currentWeek=0;buildWeeks();renderTabs();renderStrip();renderGrid();
      if(sc.groups && sc.groups.length){const el=document.getElementById('grp-'+sc.groups[0]);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
    });
    wrap.appendChild(b);
  });
}

/* ---------- 周导航 ---------- */
function gotoWeek(i){
  if(!WEEKS.length)return;
  currentWeek=Math.max(0,Math.min(WEEKS.length-1,i));
  renderGrid();renderStrip();
}
document.getElementById('wkPrev').addEventListener('click',()=>gotoWeek(currentWeek-1));
document.getElementById('wkNext').addEventListener('click',()=>gotoWeek(currentWeek+1));
// 方向键
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){gotoWeek(currentWeek-1);}
  else if(e.key==='ArrowRight'){gotoWeek(currentWeek+1);}
});
// 拖动周条
const strip=document.getElementById('weekStrip');
strip.addEventListener('pointerdown',e=>{stripDrag=true;strip.classList.add('drag');stripStartX=e.clientX;stripStartScroll=strip.scrollLeft;});
window.addEventListener('pointerup',()=>{stripDrag=false;strip.classList.remove('drag');});
strip.addEventListener('pointermove',e=>{if(stripDrag)strip.scrollLeft=stripStartScroll-(e.clientX-stripStartX);});

/* ---------- 推荐方案 ---------- */
const PRESET=['MSMK7001-E','MSMK7004-E','MSMK7013-A','MSMK7015-B','MSMK7025-C',
              'MSMK7002-B','MSMK7003-D','MSMK7005-B'];
document.getElementById('btnPreset').addEventListener('click',()=>{
  sel.clear();PRESET.forEach(id=>sel.add(id));
  currentScope='all';currentWeek=0;buildWeeks();
  renderTabs();renderCourses();renderStrip();renderGrid();updateCounts();
  jumpToFirstSelectedWeek();
  toast('已载入已注册方案（8 门无冲突）');
  if(isMobile())setCoursesOpen(false);
});
document.getElementById('btnReset').addEventListener('click',()=>{sel.clear();renderCourses();renderGrid();renderStrip();updateCounts();});

/* ---------- 方案保存 / 导入（localStorage 持久化） ---------- */
const PLAN_KEY='msmktg_plans_v1';
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function loadPlans(){try{return JSON.parse(localStorage.getItem(PLAN_KEY))||[];}catch(e){return [];}}
function writePlans(arr){localStorage.setItem(PLAN_KEY,JSON.stringify(arr));}
function renderPlans(){
  const wrap=document.getElementById('planPanel');
  const plans=loadPlans();
  if(!plans.length){wrap.innerHTML='<span class="phint">暂无保存的方案，点「保存方案」把当前选课存下来。</span>';return;}
  wrap.innerHTML='<span class="phint">我的方案（点击一键导入）：</span>'+plans.map((p,i)=>
    '<span class="plan-item" data-i="'+i+'" title="点击导入「'+escapeHtml(p.name)+'」">'+
      '<span class="pn">'+escapeHtml(p.name)+'</span>'+
      '<span class="pc">'+p.ids.length+'门</span>'+
      '<button class="pdel" title="删除该方案" data-del="'+i+'">×</button></span>'
  ).join('');
}
document.getElementById('btnSavePlan').addEventListener('click',()=>{
  if(!sel.size){toast('当前没有已选课程，无法保存');return;}
  const def='方案 '+(loadPlans().length+1);
  let name;
  try{name=window.prompt('给这个方案起个名字：',def);}catch(e){name=def;}
  if(name===null)return;                 // 用户取消
  const nm=name.trim()||def;
  const plans=loadPlans();
  plans.push({name:nm,ids:[...sel],savedAt:Date.now()});
  writePlans(plans);renderPlans();
  toast('已保存方案「'+nm+'」（'+sel.size+'门）');
});
document.getElementById('planPanel').addEventListener('click',e=>{
  const del=e.target.closest('.pdel');
  if(del){
    const i=+del.dataset.del;const plans=loadPlans();const nm=plans[i]?plans[i].name:'';
    plans.splice(i,1);writePlans(plans);renderPlans();
    toast('已删除方案「'+nm+'」');return;
  }
  const item=e.target.closest('.plan-item');
  if(item){
    const i=+item.dataset.i;const plans=loadPlans();const p=plans[i];if(!p)return;
    sel.clear();p.ids.forEach(id=>{if(SECTIONS.some(s=>idOf(s)===id))sel.add(id);});
    currentScope='all';currentWeek=0;buildWeeks();
    renderTabs();renderCourses();renderStrip();renderGrid();updateCounts();
    jumpToFirstSelectedWeek();
    toast('已导入方案「'+p.name+'」（'+sel.size+'门）');
  }
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- 手机端：课程列表抽屉 ---------- */
function isMobile(){return window.matchMedia('(max-width:820px)').matches;}
function setCoursesOpen(open){
  const list=document.getElementById('courseList'), btn=document.getElementById('btnCourses');
  list.classList.toggle('open',open);
  if(btn)btn.innerHTML=open?'收起课程列表 · <b>完成</b>':'展开课程列表 · <b>选课</b>';
}
document.getElementById('btnCourses').addEventListener('click',()=>{
  setCoursesOpen(!document.getElementById('courseList').classList.contains('open'));
});
// 手机端点选班次后自动收起列表，回到周视图
document.getElementById('courseList').addEventListener('click',e=>{
  const el=e.target.closest('.opt');
  if(el && !el.classList.contains('dim') && isMobile())setTimeout(()=>setCoursesOpen(false),150);
});

/* ---------- 初始化 ---------- */
renderTabs();buildWeeks();renderCourses();renderStrip();renderGrid();updateCounts();renderPlans();
</script>
</body>
